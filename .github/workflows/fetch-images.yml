name: 상품 사진 저장
on:
  push:
    branches: [main]
    paths: [index.html, tools/fetch_images.py, .github/workflows/fetch-images.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_images.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A img index.html
          git diff --cached --quiet || (git commit -m "상품 사진 저장소에 저장" && git push)
