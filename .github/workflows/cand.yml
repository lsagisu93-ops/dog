name: 후보 사진 받기
on:
  push:
    branches: [cand]
    paths: [cand.txt]
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p cand
          while read id url; do curl -sSL -A "Mozilla/5.0" -o "cand/$id.jpg" "$url" || true; done < cand.txt
          ls -la cand
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cand && git commit -m "후보 사진" && git push
