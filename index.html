<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="멍멍통역사 영상에 나온 반려견용품을 영상 속 번호로 찾아보세요.">
<meta property="og:title" content="반려견용품할인점 | 멍멍통역사">
<meta property="og:description" content="영상에 나온 그 제품, 영상 속 번호로 찾으세요.">
<title>반려견용품할인점</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* 레이아웃: 쇼츠 자막(레몬 + 검은 테두리)을 옮겨 온 한 줄짜리 '써봄 노트' — 번호 스티커 + 메모 목록 */
:root {
  --bg: #F3F4F1;        /* 살짝 초록기 도는 종이 */
  --paper: #FFFFFF;
  --ink: #16181D;
  --muted: #5E6470;
  --line: #DADDD6;
  --lemon: #FFE14A;     /* 쇼츠 자막 노랑 */
  --lemon-ink: #16181D;
  --focus: #2F6BFF;
  --f-display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121418; --paper: #1B1E24; --ink: #EEF0EC; --muted: #A2A8B3; --line: #2C3038;
  --lemon: #FFE14A; --lemon-ink: #16181D; --focus: #7FA3FF; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121418; --paper: #1B1E24; --ink: #EEF0EC; --muted: #A2A8B3; --line: #2C3038;
  --lemon: #FFE14A; --lemon-ink: #16181D; --focus: #7FA3FF; color-scheme: dark }

* { box-sizing: border-box }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 640px; margin: 0 auto; padding-block: 40px 56px; display: grid; gap: 28px }

header { display: grid; gap: 10px }
.brand { font-family: var(--f-display); font-size: clamp(44px, 12vw, 64px); line-height: 1; letter-spacing: -0.5px; margin: 0;
  color: var(--lemon); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink) }
.lede { margin: 0; font-size: 18px; font-weight: 500; text-wrap: balance }
.disclose { margin: 0; font-size: 13px; color: var(--muted) }

.finder { display: grid; gap: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 16px }
.finder label { font-weight: 700; font-size: 15px }
.row { display: flex; gap: 8px; flex-wrap: wrap }
.row input { flex: 1 1 160px; min-width: 0; font: 700 22px var(--f-num); padding: 10px 14px; border-radius: 10px;
  border: 2px solid var(--ink); background: var(--bg); color: var(--ink) }
.row button { font: 700 16px var(--f-body); padding: 10px 18px; border-radius: 10px; border: 2px solid var(--ink);
  background: var(--lemon); color: var(--lemon-ink); cursor: pointer }
.row button.ghost { background: transparent; color: var(--ink) }
.hint { margin: 0; font-size: 14px; color: var(--muted); min-height: 1.6em }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px }
.item { display: grid; grid-template-columns: 72px 1fr; gap: 14px; align-items: start; background: var(--paper);
  border: 1px solid var(--line); border-radius: 14px; padding: 16px }
.item.hit { border-color: var(--ink); box-shadow: 0 0 0 3px var(--lemon) }
.no { font: 700 26px/1 var(--f-num); display: grid; place-items: center; height: 64px; border-radius: 12px;
  background: var(--lemon); color: var(--lemon-ink); border: 2px solid var(--ink); font-variant-numeric: tabular-nums }
.no.tbd { font-size: 13px; font-family: var(--f-body); background: transparent; color: var(--muted); border-style: dashed; border-color: var(--line) }
.body { min-width: 0; display: grid; gap: 6px }
.tag { font-size: 12px; letter-spacing: 0.04em; color: var(--muted) }
.name { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.4; text-wrap: balance }
.memo { margin: 0; color: var(--muted); font-size: 15px }
.go { justify-self: start; margin-top: 4px; font-weight: 700; font-size: 15px; color: var(--ink); text-decoration: none;
  border-bottom: 3px solid var(--lemon); padding-bottom: 1px }
.go:hover { border-bottom-color: var(--ink) }

footer { display: grid; gap: 6px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 18px }
footer a { color: var(--ink) }
@media (prefers-reduced-motion: no-preference) { .item.hit { transition: box-shadow .2s } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 class="brand">멍멍통역사</h1>
    <p class="lede">영상에 나온 그 제품, 영상 속 번호로 찾으세요.</p>
    <p class="disclose">이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
  </header>

  <form class="finder" id="finder" autocomplete="off">
    <label for="q">영상 속 번호</label>
    <div class="row">
      <input id="q" name="q" inputmode="numeric" placeholder="예: 18" aria-describedby="hint">
      <button type="submit">찾기</button>
      <button type="button" class="ghost" id="all">전체 보기</button>
    </div>
    <p class="hint" id="hint" aria-live="polite">번호를 모르면 아래 목록에서 골라 보세요.</p>
  </form>

  <ol class="list" id="list"></ol>

  <footer>
    <span>영상은 유튜브 <strong>멍멍통역사</strong>에서 볼 수 있어요.</span>
    <span>가격·재고는 바뀔 수 있어요. 구매 전 상품 페이지에서 확인하세요.</span>
    <span>이 페이지는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span>
  </footer>
</div>

<script>
// ▼ 상품 목록: 새 상품은 여기 한 줄씩 추가 (no = 영상 속 번호, 모르면 null)
const ITEMS = [
  { no: null, tag: "반려동물 · 겨울옷", name: "강아지 할매 김장조끼", memo: "꽃무늬 누빔 조끼. 강아지·고양이, 대형견 사이즈까지.", url: "https://link.coupang.com/a/iCrNXz0MAm" },
  { no: null, tag: "반려동물 · 겨울옷", name: "퍼카라 강아지 패딩 조끼", memo: "하네스가 달린 패딩 조끼. 소형견용 겨울 아우터.", url: "https://link.coupang.com/a/iCrNXF87l6" },
];

const list = document.getElementById("list");
const hint = document.getElementById("hint");
const q = document.getElementById("q");

function render(filterNo) {
  list.textContent = "";
  const shown = filterNo == null ? ITEMS : ITEMS.filter(i => i.no === filterNo);
  for (const it of shown) {
    const li = document.createElement("li");
    li.className = "item" + (filterNo != null ? " hit" : "");
    const no = document.createElement("div");
    no.className = "no" + (it.no == null ? " tbd" : "");
    no.textContent = it.no == null ? "번호 준비중" : it.no;
    const body = document.createElement("div");
    body.className = "body";
    const tag = document.createElement("span"); tag.className = "tag"; tag.textContent = it.tag;
    const name = document.createElement("h2"); name.className = "name"; name.textContent = it.name;
    const memo = document.createElement("p"); memo.className = "memo"; memo.textContent = it.memo;
    const go = document.createElement("a"); go.className = "go"; go.href = it.url; go.target = "_blank"; go.rel = "noopener sponsored";
    go.textContent = "제품 보러 가기 ↗";
    body.append(tag, name, memo, go);
    li.append(no, body);
    list.append(li);
  }
  return shown.length;
}

document.getElementById("finder").addEventListener("submit", e => {
  e.preventDefault();
  const n = parseInt(q.value.replace(/[^0-9]/g, ""), 10);
  if (Number.isNaN(n)) { hint.textContent = "숫자만 넣어 주세요. 예: 18"; return; }
  const found = render(n);
  hint.textContent = found ? `${n}번 제품이에요.` : `${n}번은 아직 목록에 없어요. 전체 목록에서 찾아보세요.`;
  if (!found) render(null);
});
document.getElementById("all").addEventListener("click", () => {
  q.value = ""; render(null); hint.textContent = "번호를 모르면 아래 목록에서 골라 보세요.";
});
render(null);
</script>
</body>
</html>
